name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python Syntax & Dependencies
        run: |
          pip install -r requirements.txt
          python -m py_compile tools/*.py

      - name: Install Shell Tools
        run: sudo apt-get update && sudo apt-get install -y busybox shellcheck

      - name: Verify Host Script (Bash)
        run: |
          bash -n connect.sh
          shellcheck -s bash connect.sh

      - name: Verify Router Scripts with BusyBox Ash & ShellCheck
        run: |
          for script in scripts/*.sh; do
            echo "Validating $script with BusyBox ash..."
            busybox ash -n "$script"
            echo "Linting $script with shellcheck (POSIX sh)..."
            shellcheck -s sh "$script"
          done
